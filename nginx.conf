server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown routes fall back to index.html (Angular client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
