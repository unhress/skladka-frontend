server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown routes fall back to index.html (Angular client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Files that keep their URL across deploys: always revalidate, so an update never pairs new
    # code with stale translations or an old service worker.
    location ~* (?:^/i18n/.*\.json|/sw\.js|/manifest\.webmanifest|/index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Long-cache hashed static assets.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
